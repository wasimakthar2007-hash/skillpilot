<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Training — Placement Trainer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="dsa">
    <main>
        <section id="quiz-section" class="page-panel section active">
            <h2 id="quiz-title">DSA Training &amp; Testing</h2>
            <div id="loading-msg" class="hidden">Loading DSA questions... please wait.</div>

            <div id="score-board" class="hidden">
                <h3>Quiz Completed!</h3>
                <p>Your Score: <strong><span id="score">0</span> / <span id="total-questions">0</span></strong></p>
                <a class="primary-btn" href="index.html">Go to Home</a>
            </div>

            <div id="question-container" class="hidden">
                <h3 id="question-text">Question text goes here</h3>
                <div id="options-container"></div>
                <div id="feedback" class="hidden">
                    <p id="feedback-text"></p>
                    <p id="explanation-text"></p>
                </div>
                <button id="btn-next" class="primary-btn hidden" onclick="nextQuestion()">Next Question</button>
            </div>
        </section>
    </main>
    <script src="auth.js"></script>
    <script src="shared-nav.js"></script>
    <script src="questions.js"></script>
    <script src="app.js"></script>
    <script>
        if (typeof startCategory === 'function') {
            startCategory('dsa');
        }
    </script>
</body>
</html>
