name: Deploy Skill Pilot to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure app server URL
        run: |
          node -e 'const fs = require("fs"); const baseUrl = (process.env.SKILLPILOT_API_BASE_URL || "").trim().replace(/\/+$/, ""); if (baseUrl) { const url = new URL(baseUrl); if (url.protocol !== "https:") throw new Error("SKILLPILOT_API_BASE_URL must use HTTPS."); } else { console.warn("SKILLPILOT_API_BASE_URL is unset. Users can configure and verify the API URL on the AI Mentor or Resume Builder page."); } fs.writeFileSync("api-config.js", "window.SKILLPILOT_API_BASE_URL = " + JSON.stringify(baseUrl) + ";\n");'
        env:
          SKILLPILOT_API_BASE_URL: ${{ vars.SKILLPILOT_API_BASE_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
