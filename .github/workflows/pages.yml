name: Deploy Skill Pilot to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure app server URL
        run: |
          node -e "require('fs').writeFileSync('api-config.js', 'window.SKILLPILOT_API_BASE_URL = ' + JSON.stringify(process.env.SKILLPILOT_API_BASE_URL || '') + ';\\n')"
        env:
          SKILLPILOT_API_BASE_URL: ${{ vars.SKILLPILOT_API_BASE_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
