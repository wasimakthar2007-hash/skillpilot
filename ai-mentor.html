<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mentor — Skill Pilot</title>
    <link rel="icon" type="image/png" href="assets/skill-pilot-logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="mentor">
    <main>
        <section class="page-panel ai-tool">
            <p class="eyebrow">PERSONAL STUDY GUIDE</p>
            <h2>AI Mentor</h2>
            <p class="hero-text">Ask a doubt about aptitude, DSA, interviews, or career preparation. The mentor explains the answer step by step.</p>
            <form id="mentor-form" class="tool-form">
                <label for="mentor-question">Your doubt<textarea id="mentor-question" rows="6" required minlength="5" placeholder="Explain how binary search works..."></textarea></label>
                <label for="mentor-context">Context (optional)<input id="mentor-context" placeholder="For example: DSA, beginner level"></label>
                <button class="primary-btn" type="submit">Clear my doubt</button>
            </form>
            <p id="mentor-status" class="form-message" role="status"></p>
            <article id="mentor-answer" class="answer-panel hidden" aria-live="polite"></article>
        </section>
    </main>
    <script src="auth.js"></script><script src="shared-nav.js"></script><script src="ai-mentor.js"></script>
</body>
</html>
