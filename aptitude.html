<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Training — Placement Trainer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="aptitude">
    <main>
        <section class="page-panel">
            <h2 id="quiz-title">Aptitude Training &amp; Testing</h2>

            <div id="empty-bank" class="empty-state hidden">
                <p>The aptitude question bank is unavailable.</p>
                <p>Refresh the page or contact an administrator if this continues.</p>
            </div>

            <div id="loading-msg" class="hidden">Loading questions… please wait.</div>

            <div id="score-board" class="hidden">
                <h3>Quiz Completed!</h3>
                <p>Your Score: <strong><span id="score">0</span> / <span id="total-questions">0</span></strong></p>
                <button type="button" class="primary-btn" id="btn-retry">Try Again</button>
                <a class="primary-btn" href="index.html">Go to Home</a>
            </div>

            <div id="question-container" class="hidden">
                <h3 id="question-text">Question text goes here</h3>
                <div id="options-container"></div>
                <div id="feedback" class="hidden">
                    <p id="feedback-text"></p>
                    <p id="explanation-text"></p>
                </div>
                <button type="button" id="btn-next" class="primary-btn hidden">Next Question</button>
            </div>
        </section>
    </main>
    <script src="auth.js"></script>
    <script src="shared-nav.js"></script>
    <script src="questions.js"></script>
    <script src="question-store.js"></script>
    <script src="aptitude.js"></script>
</body>
</html>
